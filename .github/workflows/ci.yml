name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 runners were retired on 2026-11-02; macos-15 is Apple Silicon.
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        # Tests never open a window; on Linux skip the (heavy) Qt wheels.
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install "Pillow>=10.0.0,<12.0.0" "pywebview>=5.0,<6.0" "certifi>=2024.0.0" pytest
          else
            pip install -r requirements.txt pytest
          fi

      - name: Run tests
        run: python -m pytest tests/ -v
